# .github/workflows/e2e.yml
# Production E2E checks run after main deployment and nightly.
# Pull requests are validated by quality-gate.yml + Vercel Preview.

name: E2E Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * *'  # 03:00 AEST daily

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test smoke
        env:
          TEST_BASE_URL: https://www.learningonline.ai
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-report
          path: playwright-report/

  journeys:
    name: User journey tests
    runs-on: ubuntu-24.04
    needs: smoke
    steps:
      - id: credentials
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: |
          if [ -n "$TEST_USER_EMAIL" ] && [ -n "$TEST_USER_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Authenticated journey tests unavailable: dedicated test credentials not configured.'
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - if: steps.credentials.outputs.ready == 'true'
        run: npm ci
      - if: steps.credentials.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.credentials.outputs.ready == 'true'
        run: npx playwright test parents-journey
        env:
          TEST_BASE_URL: https://www.learningonline.ai
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-journey-report
          path: playwright-report/

  payment:
    name: Payment flow tests
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test payment-flow
        env:
          TEST_BASE_URL: https://www.learningonline.ai
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-payment-report
          path: playwright-report/
