name: Bootstrap V3 Release

on:
  push:
    branches:
      - release/self-sustaining-v3

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/self-sustaining-v3
          fetch-depth: 0
      - name: Decode release payload
        run: |
          cat .release/v3.part* | base64 -d > /tmp/v3patch.tar.gz
          tar -xzf /tmp/v3patch.tar.gz
          rm -rf .release
          rm -f .github/workflows/quality-gate.yml .github/workflows/content-refresh.yml
      - name: Validate release invariants
        run: |
          node --check pages/api/create-checkout-session.js
          node --check pages/api/verify-checkout.js
          node --check pages/api/stripe-webhook.js
          node --check pages/api/admin/send-journey-campaign.js
          node --check pages/api/cron/commercial-health.js
          node --check lib/auth.js
          node scripts/release-check.mjs
      - name: Commit integrated release
        run: |
          git config user.name "LearningOnline Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrated self-sustaining v3 release [v3-applied]"
          git push origin HEAD:release/self-sustaining-v3
