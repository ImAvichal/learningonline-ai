name: One-time Next.js 16 Upgrade Preparation
on:
  push:
    branches: [security/next16-upgrade-20261123]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'ImAvichal/learningonline-ai' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade Next.js and generate a consistent lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@16.4.6
          npm audit fix --ignore-scripts || true
          npm ci
          npm run check:release
          npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      - name: Show unresolved dependency vulnerabilities
        run: npm audit --audit-level=high || true
      - name: Commit lockfile and package upgrade to branch only
        run: |
          git config user.name 'leO-security-upgrade-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: upgrade Next.js to patched 16.4.6 with lockfile'
            git push origin HEAD:security/next16-upgrade-20261123
          fi
